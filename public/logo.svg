<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none" className="w-full h-full">
  <!-- Luxury Ring / Diamond Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagon/Diamond -->
    <polygon points="20,2 38,20 20,38 2,20" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
    <!-- Inner faceted geometry -->
    <polygon points="20,7 33,20 20,33 7,20" stroke="url(#silverGrad)" stroke-width="1.2" fill="none" opacity="0.8"/>
    <!-- Center Sparkle -->
    <circle cx="20" cy="20" r="3" fill="url(#goldGrad)"/>
    <!-- Radiant lines -->
    <line x1="20" y1="0" x2="20" y2="40" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
  </g>
  
  <!-- Typography -->
  <text x="60" y="27" font-family="'Cormorant Garamond', serif" font-size="20" font-weight="700" letter-spacing="3" fill="#2A2A2A">
    PLATINUM
  </text>
  <text x="60" y="42" font-family="'Inter', sans-serif" font-size="9" font-weight="500" letter-spacing="5" fill="#D4AF37">
    PROJECT BALI
  </text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8B8B8B"/>
    </linearGradient>
  </defs>
</svg>
